name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format source (temporary verification step)
        run: |
          bunx prettier --write src/routes/index.tsx src/routes/__root.tsx
          echo "---BEGIN_FORMATTED_INDEX---"
          cat src/routes/index.tsx
          echo "---END_FORMATTED_INDEX---"
          echo "---BEGIN_FORMATTED_ROOT---"
          cat src/routes/__root.tsx
          echo "---END_FORMATTED_ROOT---"

      - name: Run ESLint
        run: bun run lint

      - name: Build production bundle
        run: bun run build

      - name: Run tests
        run: bun run test
