name: One-time landing formatter

on:
  push:
    branches:
      - feat/nivora-landing-2.0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out landing branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format landing page files
        run: bunx prettier --write src/routes/index.tsx src/styles.css

      - name: Commit formatted files on this branch only
        run: |
          git add src/routes/index.tsx src/styles.css
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format NIVORA landing page"
          git push
